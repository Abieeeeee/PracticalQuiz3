<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar System VR</title>
  <script src="script/aframe.min.js"></script>
</head>
<body>

<!-- ═══════════════════════════════════════════
     A-FRAME VR SCENE
═══════════════════════════════════════════ -->
<a-scene
  renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: true">

  <!-- ─── ASSETS ─── -->
  <a-assets timeout="12000">
    <img id="sun-tex"         src="texture/sun.jpg"/>
    <img id="mercury-tex"     src="texture/mercury.jpg"/>
    <img id="venus-tex"       src="texture/venus.jpg"/>
    <img id="earth-tex"       src="texture/earth.jpg"/>
    <img id="mars-tex"        src="texture/mars.jpg"/>
    <img id="jupiter-tex"     src="texture/jupiter.jpg"/>
    <img id="saturn-tex"      src="texture/saturn.jpg"/>
    <img id="saturn-ring-tex" src="texture/saturn_ring.png"/>
    <img id="uranus-tex"      src="texture/uranus.jpg"/>
    <img id="neptune-tex"     src="texture/neptune.jpg"/>
    <img id="stars-tex"       src="texture/2k_stars.jpg"/>
  </a-assets>

  <!-- ─── STARFIELD ─── -->
  <a-sky src="texture/2k_stars.jpg" radius="4000" rotation="0 -90 0"></a-sky>

  <!-- ─── LIGHTING ─── -->
  <a-light type="point" color="#fff8e1" intensity="6" position="0 0 0" distance="5000" decay="0.5"></a-light>
  <a-light type="directional" color="#aabbff" intensity="0.6" position="-300 80 -300"></a-light>
  <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>

  <!-- ─── CAMERA RIG ─── -->
  <a-entity id="rig" position="0 10 88"
    animation__drift="property: position; to: 0 7 72; dur: 25000; easing: easeInOutSine; loop: true; dir: alternate">
    <a-camera look-controls wasd-controls="acceleration:30" fov="68">
      <a-cursor color="#ffcc44" opacity="0.45"
        geometry="primitive:ring; radiusInner:0.006; radiusOuter:0.009"
        material="color:#ffcc44; shader:flat">
      </a-cursor>
    </a-camera>
  </a-entity>

  <!-- ═══════════════════════════════════════
       SUN
  ═══════════════════════════════════════ -->
  <!-- Core — unchanged -->
  <a-sphere radius="6.5" position="0 0 0" src="#sun-tex"
    emissive="#ff6a00" emissive-intensity="2"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 8500; easing: linear">
  </a-sphere>
  <!-- Chromosphere glow 1 -->
  <a-sphere radius="7.5" position="0 0 0"
    material="color:#ff8800; transparent:true; opacity:0.20; shader:flat; side:front; depthWrite:false"
    animation="property: rotation; to: 0 -360 25; loop: true; dur: 11000; easing: linear">
  </a-sphere>
  <!-- Corona glow 2 -->
  <a-sphere radius="9.2" position="0 0 0"
    material="color:#ff5500; transparent:true; opacity:0.09; shader:flat; side:front; depthWrite:false"
    animation="property: rotation; to: 0 360 -15; loop: true; dur: 18000; easing: linear">
  </a-sphere>

  <!-- ═══════════════════════════════════════
       ORBIT TRAIL RINGS
  ═══════════════════════════════════════ -->
  <a-torus radius="14"  radius-tubular="0.055" segments-tubular="120" rotation="-90 0 0" material="color:#cccccc; transparent:true; opacity:0.16; shader:flat"></a-torus>
  <a-torus radius="20"  radius-tubular="0.055" segments-tubular="130" rotation="-90 0 0" material="color:#e8cda0; transparent:true; opacity:0.14; shader:flat"></a-torus>
  <a-torus radius="27"  radius-tubular="0.055" segments-tubular="150" rotation="-90 0 0" material="color:#4fa3e0; transparent:true; opacity:0.16; shader:flat"></a-torus>
  <a-torus radius="36"  radius-tubular="0.055" segments-tubular="160" rotation="-90 0 0" material="color:#c1440e; transparent:true; opacity:0.14; shader:flat"></a-torus>
  <!-- Asteroid belt (wide dusty band) -->
  <a-torus radius="46"  radius-tubular="2.2"   segments-tubular="200" rotation="-90 0 0" material="color:#4a3a28; transparent:true; opacity:0.055; shader:flat"></a-torus>
  <a-torus radius="60"  radius-tubular="0.06"  segments-tubular="200" rotation="-90 0 0" material="color:#c88b3a; transparent:true; opacity:0.16; shader:flat"></a-torus>
  <a-torus radius="80"  radius-tubular="0.06"  segments-tubular="230" rotation="-90 0 0" material="color:#e4d191; transparent:true; opacity:0.13; shader:flat"></a-torus>
  <a-torus radius="100" radius-tubular="0.06"  segments-tubular="250" rotation="-90 0 0" material="color:#7de8e8; transparent:true; opacity:0.13; shader:flat"></a-torus>
  <a-torus radius="120" radius-tubular="0.06"  segments-tubular="270" rotation="-90 0 0" material="color:#4b70dd; transparent:true; opacity:0.13; shader:flat"></a-torus>

  <!-- ═══════════════════════════════════════
       ASTEROID BELT PARTICLES
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 190000; easing: linear">
    <a-sphere radius="0.13" position="42 0.4 0"    material="color:#7a6050; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.09" position="-43.5 -0.2 5" material="color:#6a5040; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.15" position="44 0.6 -9"   material="color:#8a7060; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.08" position="-45 0.1 13"  material="color:#6a5540; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.12" position="46.5 -0.5 -4" material="color:#786050; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.14" position="-47 0.7 7"   material="color:#887060; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.07" position="48 0.3 15"   material="color:#635040; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.11" position="-49 -0.4 -10" material="color:#736050; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.13" position="50 0.5 3"    material="color:#7e6855; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.10" position="-51 0.2 -15" material="color:#6a5848; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.12" position="43.5 -0.6 21" material="color:#746050; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.09" position="-44 0.4 -19" material="color:#7c6a58; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.14" position="47 0.7 -22"  material="color:#685545; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.08" position="-46.5 -0.3 23" material="color:#786553; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.11" position="45 0.2 -26"  material="color:#7d6a57; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.10" position="-42 0.5 27"  material="color:#625040; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.13" position="51 -0.4 -28" material="color:#826e5b; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.07" position="-50 0.6 29"  material="color:#655342; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.12" position="44.5 0.3 -32" material="color:#7a6655; roughness:1; metalness:0"></a-sphere>
    <a-sphere radius="0.09" position="-43 -0.5 33" material="color:#6e5c4a; roughness:1; metalness:0"></a-sphere>
  </a-entity>

  <!-- ═══════════════════════════════════════
       1. MERCURY  (orbit 14 · 4 s)
       planet: 0.55 → 1.0
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
    <a-sphere radius="1.0" position="14 0 0" src="#mercury-tex" material="shader:flat"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 2800; easing: linear">
    </a-sphere>
  </a-entity>

  <!-- ═══════════════════════════════════════
       2. VENUS  (orbit 20 · 7 s)
       planet: 1.18 → 2.0  |  glow: 1.42 → 2.4
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
    <!-- Thick sulphur cloud atmosphere -->
    <a-sphere radius="2.4" position="20 0 0"
      material="color:#f0c060; transparent:true; opacity:0.18; shader:flat; depthWrite:false">
    </a-sphere>
    <a-sphere radius="2.0" position="20 0 0" src="#venus-tex" material="shader:flat"
      animation="property: rotation; to: 0 -360 0; loop: true; dur: 11000; easing: linear">
    </a-sphere>
  </a-entity>

  <!-- ═══════════════════════════════════════
       3. EARTH  (orbit 27 · 10 s)
       planet: 1.28 → 2.2  |  glow: 1.46 → 2.65
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
    <!-- Atmosphere -->
    <a-sphere radius="2.65" position="27 0 0"
      material="color:#3399ff; transparent:true; opacity:0.13; shader:flat; depthWrite:false">
    </a-sphere>
    <a-sphere radius="2.2" position="27 0 0" src="#earth-tex" material="shader:flat"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 3800; easing: linear">
    </a-sphere>
    <!-- Moon orbit -->
    <a-entity position="27 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 2800; easing: linear">
      <a-sphere radius="0.45" position="3.5 0 0"
        material="color:#aaaaaa; roughness:1"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4500; easing: linear">
      </a-sphere>
    </a-entity>
  </a-entity>

  <!-- ═══════════════════════════════════════
       4. MARS  (orbit 36 · 16 s)
       planet: 0.92 → 1.6  |  glow: 1.08 → 1.9
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
    <!-- Dust haze -->
    <a-sphere radius="1.9" position="36 0 0"
      material="color:#ff5522; transparent:true; opacity:0.09; shader:flat; depthWrite:false">
    </a-sphere>
    <a-sphere radius="1.6" position="36 0 0" src="#mars-tex" material="shader:flat"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 4100; easing: linear">
    </a-sphere>
    <!-- Phobos -->
    <a-entity position="36 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 1200; easing: linear">
      <a-sphere radius="0.15" position="2.4 0.2 0"
        material="color:#887766; roughness:1">
      </a-sphere>
    </a-entity>
  </a-entity>

  <!-- ═══════════════════════════════════════
       5. JUPITER  (orbit 60 · 35 s)
       planet: 4.7 → 7.5  |  glow: 5.1 → 8.2
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 35000; easing: linear">
    <!-- Magnetosphere glow -->
    <a-sphere radius="8.2" position="60 0 0"
      material="color:#cc8844; transparent:true; opacity:0.09; shader:flat; depthWrite:false">
    </a-sphere>
    <a-sphere radius="7.5" position="60 0 0" src="#jupiter-tex" material="shader:flat"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 1700; easing: linear">
    </a-sphere>
    <!-- Io moon -->
    <a-entity position="60 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 2200; easing: linear">
      <a-sphere radius="0.4" position="9.5 0 0"
        material="color:#ddcc44; roughness:0.8">
      </a-sphere>
    </a-entity>
    <!-- Europa moon -->
    <a-entity position="60 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 4500; easing: linear">
      <a-sphere radius="0.35" position="12.0 0 0"
        material="color:#ddeeff; roughness:0.6">
      </a-sphere>
    </a-entity>
  </a-entity>

  <!-- ═══════════════════════════════════════
       6. SATURN  (orbit 80 · 55 s)
       planet: 4.0 → 6.5  |  rings scaled up
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 55000; easing: linear">

    <a-sphere radius="6.5" position="80 0 0" src="#saturn-tex" material="shader:flat"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 2100; easing: linear">
    </a-sphere>

    <!-- Ring system (3 tori at varying tilt) — scaled with planet -->
    <a-entity position="80 0 0" rotation="-90 0 27">
      <!-- Inner ring: dense -->
      <a-torus radius="9.0"  radius-tubular="1.2" segments-tubular="130" segments-radial="6"
        src="#saturn-ring-tex"
        material="transparent:true; opacity:0.88; side:double; depthWrite:false">
      </a-torus>
      <!-- Middle ring -->
      <a-torus radius="11.5" radius-tubular="0.9" segments-tubular="150" segments-radial="6"
        src="#saturn-ring-tex"
        material="transparent:true; opacity:0.58; side:double; depthWrite:false">
      </a-torus>
      <!-- Outer wispy ring -->
      <a-torus radius="13.5" radius-tubular="0.6" segments-tubular="170" segments-radial="6"
        src="#saturn-ring-tex"
        material="transparent:true; opacity:0.28; side:double; depthWrite:false">
      </a-torus>
    </a-entity>

    <!-- Titan moon -->
    <a-entity position="80 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      <a-sphere radius="0.5" position="17.0 0 0"
        material="color:#ddaa55; roughness:0.8">
      </a-sphere>
    </a-entity>
  </a-entity>

  <!-- ═══════════════════════════════════════
       7. URANUS  (orbit 100 · 80 s · tilt 98°)
       planet: 2.6 → 4.5  |  glow: 2.78 → 5.2  |  ring scaled
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 80000; easing: linear">

    <!-- Thin rings (near-vertical because of tilt) -->
    <a-entity position="100 0 0" rotation="8 0 0">
      <a-torus radius="6.0" radius-tubular="0.28" segments-tubular="110" segments-radial="5"
        material="color:#aaeedd; transparent:true; opacity:0.38; side:double; depthWrite:false">
      </a-torus>
    </a-entity>

    <!-- Ice giant atmospheric glow -->
    <a-sphere radius="5.2" position="100 0 0"
      material="color:#55ddcc; transparent:true; opacity:0.12; shader:flat; depthWrite:false">
    </a-sphere>

    <a-sphere radius="4.5" position="100 0 0" src="#uranus-tex" material="shader:flat"
      rotation="0 0 98"
      animation="property: rotation; to: 0 360 98; loop: true; dur: 2900; easing: linear">
    </a-sphere>
  </a-entity>

  <!-- ═══════════════════════════════════════
       8. NEPTUNE  (orbit 120 · 110 s)
       planet: 2.45 → 4.2  |  glow: 2.7 → 5.0
  ═══════════════════════════════════════ -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 110000; easing: linear">

    <!-- Deep blue atmospheric glow -->
    <a-sphere radius="5.0" position="120 0 0"
      material="color:#1133ff; transparent:true; opacity:0.14; shader:flat; depthWrite:false">
    </a-sphere>

    <a-sphere radius="4.2" position="120 0 0" src="#neptune-tex" material="shader:flat"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 3100; easing: linear">
    </a-sphere>

    <!-- Triton (retrograde orbit) -->
    <a-entity position="120 0 0"
      animation="property: rotation; to: 0 -360 20; loop: true; dur: 3800; easing: linear">
      <a-sphere radius="0.38" position="6.0 0 0"
        material="color:#88aacc; roughness:0.9">
      </a-sphere>
    </a-entity>
  </a-entity>

</a-scene>

</body>
</html>
